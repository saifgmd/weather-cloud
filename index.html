<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e14" />
  <meta name="description" content="Weather Cloud — Interactive rainy window with WebGL raindrops. By SAIF G.M.D" />
  <meta name="author" content="SAIF G.M.D" />
  <meta name="application-name" content="Weather Cloud" />

  <meta property="og:title" content="Weather Cloud" />
  <meta property="og:description" content="Interactive rainy window — by SAIF G.M.D" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Weather Cloud" />

  <title>Weather Cloud — SAIF G.M.D</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Skip Link -->
  <a href="#panel" class="skip-link">Skip to settings</a>

  <!-- Background Image -->
  <img
    id="custom-bg"
    src="https://picsum.photos/id/1015/1920/1080"
    alt="Rainy background"
    crossorigin="anonymous"
  />

  <!-- Background Video -->
  <video id="custom-video" class="hidden" muted loop playsinline webkit-playsinline preload="metadata" aria-hidden="true"></video>

  <!-- Color Overlay -->
  <div id="color-overlay" aria-hidden="true"></div>

  <!-- Raindrops Canvas -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- Loading Overlay -->
  <div id="loading-overlay" role="status" aria-live="polite">
    <div class="loader-spinner"></div>
    <span class="loader-text">Loading...</span>
  </div>

  <!-- Widgets Stack (centered iOS style) -->
  <div class="widgets-stack" id="widgets-container">

    <!-- Clock Card -->
    <div class="glass-card clock-card" id="datetime-widget">
      <div class="clock-time">
        <span id="time-display">--:--</span>
        <span class="clock-seconds" id="time-seconds">--</span>
      </div>
      <div class="clock-date" id="date-display">--</div>
      <div class="clock-day" id="day-display">--</div>
      <div class="clock-pill" id="day-phase">
        <span class="pill-icon" id="day-phase-icon">☀️</span>
        <span id="day-phase-text">--</span>
      </div>
    </div>

    <!-- Weather Card -->
    <div class="glass-card weather-card" id="weather-widget">
      <div class="weather-header">
        <div class="weather-loc-wrap">
          <span class="loc-pin">📍</span>
          <span class="loc-name" id="weather-location">--</span>
          <span class="loc-dot">•</span>
          <span class="loc-time" id="weather-time">--:--</span>
        </div>
        <div class="weather-updated" id="weather-updated">--:--</div>
      </div>

      <div class="weather-hero">
        <div class="weather-icon-big" id="weather-icon">☀️</div>
        <div class="weather-temp-wrap">
          <span class="weather-temp" id="weather-temp">--</span>
          <span class="weather-unit">°C</span>
        </div>
      </div>

      <div class="weather-desc" id="weather-desc">--</div>

      <div class="weather-stats">
        <div class="stat-box">
          <div class="stat-icon">💧</div>
          <div class="stat-value" id="weather-humidity">--%</div>
        </div>
        <div class="stat-box">
          <div class="stat-icon">💨</div>
          <div class="stat-value" id="weather-wind">-- km/h</div>
        </div>
        <div class="stat-box">
          <div class="stat-icon">🌡️</div>
          <div class="stat-value" id="weather-feels">--°</div>
        </div>
      </div>

      <div class="weather-forecast" id="weather-forecast">
        <!-- Filled by JS -->
      </div>
    </div>

  </div>

  <!-- Top-Right UI Buttons -->
  <div class="ui-controls">
    <button id="btn-sound" class="ui-btn" type="button" aria-label="Toggle sound" aria-pressed="true">
      <span id="sound-toggle">🔊</span>
    </button>
    <button id="btn-fullscreen" class="ui-btn" type="button" aria-label="Enter fullscreen">⛶</button>
    <button id="btn-settings" class="ui-btn" type="button" aria-label="Open settings" aria-expanded="false">⚙</button>
  </div>

  <!-- Settings Panel -->
  <aside id="panel" class="panel" aria-hidden="true" aria-label="Settings">
    <button id="panel-close" class="panel-close" type="button" aria-label="Close settings">✕</button>

    <h2 class="panel-title">Settings</h2>

    <div class="control-group">
      <label for="blur-range">Blur <span id="blur-val" class="value">5px</span></label>
      <input type="range" id="blur-range" min="0" max="25" value="5" step="1" />
    </div>

    <div class="control-group">
      <label for="brightness-range">Brightness <span id="brightness-val" class="value">30%</span></label>
      <input type="range" id="brightness-range" min="20" max="120" value="30" step="1" />
    </div>

    <div class="control-group">
      <label for="rain-range">Rain <span id="rain-val" class="value">70%</span></label>
      <input type="range" id="rain-range" min="20" max="100" value="70" step="1" />
    </div>

    <div class="control-group">
      <label for="overlay-range">Overlay <span id="overlay-val" class="value">0%</span></label>
      <input type="range" id="overlay-range" min="0" max="80" value="0" step="1" />
      <div class="color-grid" role="radiogroup" aria-label="Overlay color">
        <button class="color-btn active" data-color="none" type="button" aria-checked="true" role="radio">None</button>
        <button class="color-btn" data-color="#3b82f6" type="button" aria-checked="false" role="radio">Blue</button>
        <button class="color-btn" data-color="#8b5cf6" type="button" aria-checked="false" role="radio">Purple</button>
        <button class="color-btn" data-color="#ef4444" type="button" aria-checked="false" role="radio">Red</button>
        <button class="color-btn" data-color="#10b981" type="button" aria-checked="false" role="radio">Green</button>
        <button class="color-btn" data-color="#f59e0b" type="button" aria-checked="false" role="radio">Amber</button>
      </div>
    </div>

    <div class="control-group">
      <label for="volume-range">Volume <span id="volume-val" class="value">50%</span></label>
      <input type="range" id="volume-range" min="0" max="100" value="50" step="1" />
    </div>

    <div class="control-group">
      <label>Background</label>
      <div id="preset-grid" class="preset-grid" role="listbox" aria-label="Background presets"></div>
    </div>

    <div class="control-group">
      <label for="url-input">Custom URL</label>
      <div class="input-row">
        <input type="url" id="url-input" placeholder="https://example.com/image.jpg" autocomplete="off" />
        <button id="url-btn" type="button" class="small-btn">Load</button>
      </div>
    </div>

    <div class="control-group">
      <label>Upload</label>
      <input type="file" id="file-input" accept="image/*,video/*" hidden />
      <button id="file-btn" type="button" class="wide-btn">Choose File…</button>
    </div>

    <div class="actions">
      <button id="btn-share" type="button" class="action-btn">Share</button>
      <button id="btn-save" type="button" class="action-btn">Save</button>
      <button id="btn-reset" type="button" class="action-btn danger">Reset</button>
      <button id="btn-install" type="button" class="action-btn install hidden">Install App</button>
    </div>

    <footer class="app-footer">
      <small>
        <strong>Weather Cloud</strong> — by
        <span class="signature">SAIF G.M.D</span>
      </small>
    </footer>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <audio id="rain-audio" loop preload="auto">
    <source src="https://fyildiz1974.github.io/web/files/rain.mp3" type="audio/mpeg" />
  </audio>

  <script src="app.js"></script>
</body>
</html>
